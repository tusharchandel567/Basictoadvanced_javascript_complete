<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <script>
        var product = {
            "title": "Vivo Y21 (Midnight Blue, 64 GB)  (4 GB RAM)",
            "actualPrice": 17999,
            "offers": [
                "Bank offers 10% off bank of Barodera Creadit Card EMI Transactions , up ti a , 1000 on orders of 5,000 and above T&C",
                "Bank Offer10% off on IDFc FIRST BANK Credit Card EMI Transactions , up to rs, 1000 on orders of rs - 5000 and above T&C",
                "Bank Offer10% off on IdusIn BankCreadit card Emi Transactions , uup to rs - 1000 on orders of rs - 5000 and above T&C",
                "BUY 2 GET 1 FREE on select items T&C",
                "No Cost EMI on Bajaj Finserv EMI Card on cart value above Rs. 3000 T&C",
                "Partner OfferSign up for Flipkart Pay Later and get Flipkart Gift Card worth up to Rs. 500* Know More"
            ],
            "rating": { "rate": 4.3, "ratings": 96490, "reviews": 10000 },
            "photo": "./public/doc/images/vivo.png"
        };

        function bodyload() {
            document.getElementById("productImage").src = product.photo;
            document.getElementById("productTitle").innerText = product.title;
            document.getElementById("productPrice").innerText = product.actualPrice;
            document.getElementById("productRating").innerText = product.rating.rate;
            document.getElementById("productRatingCount").innerText = product.rating.ratings;
            document.getElementById("productReviewCount").innerText = product.rating.reviews;

            var offersList = document.getElementById("productOffers");
            product.offers.forEach(offer => {
                var li = document.createElement("li");
                li.innerText = offer;
                offersList.appendChild(li);
            });
        }
    </script>
</head>
<body class="container-fluid" onload="bodyload()">
    <section class="row mt-4">
        <div class="col-3">
            <img width="300" height="400" id="productImage">
        </div>
        <div class="col-9">
            <h3 id="productTitle"></h3>
            <div class = "bg-success text-white p-1 roundes" style="width:60px">
                <span id="productRating"></span>
                <span class="bi bi-star-fill"></span>
            </div>
            <div class="ms-3">
                <span id="productRatingCount"></span>
                <span>Ratings &</span>
                <span id="productReviewCount"></span>
                <span>Reviews</span>
            </div>
            <div class="mt-4">
                <h4>Price : <span id="productPrice"></span></h4>
                <h5>Offers : </h5>
                <ul id="productOffers"></ul>
            </div>
            <div>
                <h3>offers</h3>
                <ul>
                    offers.forEach(offer => {
                        var li = document.createElement("li");
                        li.innerText = offer;
                        document.getElementById("productOffers").appendChild(li);
                    });
                </ul>
            </div>
        </div>

    </section>
    
</body>
</html>
