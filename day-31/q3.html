    <title>write a program to find if the given values are for a triangle square </title>
    <script>
        function findshape(values){
            if(values.length==3){
                document.write("values are of triangle");
            }else if (values.length==4){
                document.write("values of square ");

                document.write("please provide values only for square or a triangle");

        }
        findshape([10,40,20,20,20,9]);
    </script>
